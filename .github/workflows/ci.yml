name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LAUNCH_BYPASS_SECRET: ${{ secrets.LAUNCH_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fail fast if any ESM-only package sneaks into the dep tree
      - name: Check for forbidden ESM-only transitive deps
        run: node scripts/check-esm-deps.mjs

      # Full production build — same Turbopack config as Vercel deploy
      - name: Production build
        run: npm run build

      # Start the production server and run HTTP smoke tests against it
      - name: HTTP smoke tests
        run: |
          echo "Currently listening processes on port 3000:"
          (lsof -i :3000 -sTCP:LISTEN -n -P || ss -ltnp | grep :3000 || true)

          pkill -f "next start" || true
          sleep 2

          if command -v lsof >/dev/null 2>&1; then
            if lsof -i :3000 -sTCP:LISTEN -t >/dev/null 2>&1; then
              echo "Port 3000 in use by PID(s): $(lsof -i :3000 -sTCP:LISTEN -t)"
              lsof -i :3000 -sTCP:LISTEN -t | xargs -r kill -9 || true
              sleep 1
            fi
          else
            fuser -k 3000/tcp || true
          fi
          npx kill-port 3000 || true

          npm start &
          SERVER_PID=$!
          echo "Started server PID=$SERVER_PID"
          npx wait-on http://localhost:3000 --timeout 60000
          LAUNCH_BYPASS_SECRET=${{ secrets.LAUNCH_BYPASS_SECRET }} \
            node tests/smoke.mjs
          kill $SERVER_PID || true
          npx kill-port 3000 || true
          sleep 2

      # Start a fresh server for the browser-level console error smoke test.
      # The port-kill logic ensures any leftover server from the previous step is cleaned up.
      - name: Browser console smoke tests
        if: always()
        run: |
          echo "Currently listening processes on port 3000:"
          (lsof -i :3000 -sTCP:LISTEN -n -P || ss -ltnp | grep :3000 || true)

          pkill -f "next start" || true
          sleep 2

          if command -v lsof >/dev/null 2>&1; then
            if lsof -i :3000 -sTCP:LISTEN -t >/dev/null 2>&1; then
              echo "Port 3000 in use by PID(s): $(lsof -i :3000 -sTCP:LISTEN -t)"
              lsof -i :3000 -sTCP:LISTEN -t | xargs -r kill -9 || true
              sleep 1
            fi
          else
            fuser -k 3000/tcp || true
          fi
          npx kill-port 3000 || true

          npm start &
          SERVER_PID=$!
          echo "Started server PID=$SERVER_PID"
          npx wait-on http://localhost:3000 --timeout 60000
          LAUNCH_BYPASS_SECRET=${{ secrets.LAUNCH_BYPASS_SECRET }} \
            node tests/smoke-console.mjs
          kill $SERVER_PID || true
          npx kill-port 3000 || true
          sleep 2

      # Start another fresh server for the interactive smoke tests (admin routes,
      # form interactions, login flow).
      - name: Browser interactive smoke tests
        if: always()
        run: |
          echo "Currently listening processes on port 3000:"
          (lsof -i :3000 -sTCP:LISTEN -n -P || ss -ltnp | grep :3000 || true)

          pkill -f "next start" || true
          sleep 2

          if command -v lsof >/dev/null 2>&1; then
            if lsof -i :3000 -sTCP:LISTEN -t >/dev/null 2>&1; then
              echo "Port 3000 in use by PID(s): $(lsof -i :3000 -sTCP:LISTEN -t)"
              lsof -i :3000 -sTCP:LISTEN -t | xargs -r kill -9 || true
              sleep 1
            fi
          else
            fuser -k 3000/tcp || true
          fi
          npx kill-port 3000 || true

          npm start &
          SERVER_PID=$!
          echo "Started server PID=$SERVER_PID"
          npx wait-on http://localhost:3000 --timeout 60000
          LAUNCH_BYPASS_SECRET=${{ secrets.LAUNCH_BYPASS_SECRET }} \
            node tests/smoke-interactive.mjs
          kill $SERVER_PID || true
          npx kill-port 3000 || true
          sleep 2
